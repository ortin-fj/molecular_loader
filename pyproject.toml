[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molecular-loader"
version = "0.2.0"
description = "Load molecules and molecular dynamics trajectories into Blender as spheres, bonds and keyframes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ortin-fj", email = "ortin.fj@gmail.com" }]
keywords = ["blender", "ase", "molecular-dynamics", "chemistry", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
#: Runtime dependencies of the parts that do not need Blender.  Inside Blender
#: they are installed as well, but with ``--no-deps`` so that ASE and scipy use
#: the numpy that Blender ships (see src/molecular_loader/deps.py).
dependencies = ["ase>=3.22", "numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ortin-fj/molecular_loader"
Issues = "https://github.com/ortin-fj/molecular_loader/issues"

[tool.uv]
#: `uv sync` installs the package itself, so `uv run` can import it.  Note that
#: bpy/bmesh/mathutils only exist inside Blender: the virtual environment is for
#: tests and tools, never for running the loader.
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/molecular_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/blender", "libs", "dist", ".venv"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/molecular_loader/libs", "tests/data", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# The element table is a copied data block with long lines.
"src/molecular_loader/elements.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["molecular_loader"]
